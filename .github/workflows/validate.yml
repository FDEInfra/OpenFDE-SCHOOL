name: Validate OpenFDE School

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate school package
        run: python scripts/validate_school.py
      - name: Validate learner wall
        run: python scripts/validate_wall.py
      - name: Validate enterprise training lab
        run: python scripts/validate_lab.py
      - name: Compile validation scripts
        run: python -m py_compile scripts/validate_school.py scripts/validate_wall.py scripts/validate_lab.py assets/enterprise-lab/lab.py
