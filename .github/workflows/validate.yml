name: Validate OpenFDE School

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate school package
        run: python scripts/validate_school.py
      - name: Validate learner wall
        run: python scripts/validate_wall.py
      - name: Validate enterprise training lab
        run: python scripts/validate_lab.py
      - name: Validate install and repository migration
        run: python scripts/validate_install.py
      - name: Compile validation scripts
        run: python -m py_compile scripts/validate_school.py scripts/validate_wall.py scripts/validate_lab.py scripts/validate_install.py assets/enterprise-lab/lab.py
